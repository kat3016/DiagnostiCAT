# CrewAI tasks for the conversational anamnesis flow (3 sequential tasks)

conversational_interview_task:
  description: >
    REQUIRED INITIAL WARNING: ALWAYS begin with "I am DiagnostiCAT, an AI assistant for collecting medical information. This conversation does NOT replace a professional medical consultation. Please consult a certified doctor for diagnosis and treatment."

    Conduct a structured initial medical interview using exactly these 7 required questions:
    1. "What is the main reason for your consultation today?"
    2. "When did these symptoms start?"
    3. "How would you describe the intensity of your symptoms on a scale from 1 to 10?"
    4. "Do you have any relevant medical history?"
    5. "Are you currently taking any medications?"
    6. "Is there any family history of important illnesses?"
    7. "Do you smoke, drink alcohol, or have any other relevant habits?"

    IMPORTANT:
    - ALWAYS start with the warning that you are AI and do NOT replace a medical consultation
    - Ask ONLY one question at a time in conversational mode
    - DO NOT ask additional questions outside this list
    - Maintain a professional and empathetic tone
    - DO NOT give medical advice; only collect information
    - Wait for a complete answer before continuing
    - Periodically remind the patient that you are an AI assistant
  expected_output: >
    A structured summary of the patient's 7 answers in this format:
    WARNING: This information was collected by an AI assistant and does NOT replace professional medical evaluation.

    CONVERSATIONAL INTERVIEW COMPLETED:
    1. Reason for consultation: [answer]
    2. Symptom onset: [answer]
    3. Intensity (1-10): [answer]
    4. Medical history: [answer]
    5. Current medications: [answer]
    6. Family history: [answer]
    7. Relevant habits: [answer]

    REMINDER: Consult a medical professional for a complete medical evaluation.
  agent: conversational_interviewer
  context: []

specific_questions_analysis_task:
  description: >
    REQUIRED INITIAL WARNING: Always mention "I am an AI assistant. The following hypotheses are generated automatically and DO NOT constitute a medical diagnosis. Evaluation by a medical professional is required."

    Analyze the initial interview information and generate:
    1. Up to 3 preliminary hypotheses about possible health concerns (WITHOUT definitive diagnoses)
    2. Exactly 5 specific questions to clarify and enrich the data for the classification model

    The specific questions must be:
    - Precise and directed at specific symptoms
    - Oriented toward obtaining data for automated classification models
    - Focused on characteristics, location, and aggravating/relieving factors
    - Related to the preliminary hypotheses generated
    - Designed to maximize classification model accuracy

    IMPORTANT: NEVER present hypotheses as definitive diagnoses.
  expected_output: >
    WARNING: The following hypotheses are generated by AI for informational purposes only and DO NOT constitute professional medical diagnosis.

    Analysis format:
    PRELIMINARY AI HYPOTHESES (NOT diagnoses):
    1. [hypothesis 1 - for reference only, NOT a definitive diagnosis]
    2. [hypothesis 2 - for reference only, NOT a definitive diagnosis]
    3. [hypothesis 3 - for reference only, NOT a definitive diagnosis]

    SPECIFIC QUESTIONS FOR THE CLASSIFICATION MODEL:
    1. [specific ML data-oriented question]
    2. [specific ML data-oriented question]
    3. [specific ML data-oriented question]
    4. [specific ML data-oriented question]
    5. [specific ML data-oriented question]
  agent: specific_questions_analyst
  context:
    - conversational_interview_task

json_structuring_and_classification_task:
  description: >
    REQUIRED INITIAL WARNING: Always mention "I am an AI assistant. Classification results are automatic and DO NOT constitute a medical diagnosis. This information is for reference only and professional medical evaluation is required."

    DOUBLE TASK - Structure data and run classification:

    PART 1 - STRUCTURING:
    Convert ALL information collected during the conversational anamnesis into standardized JSON format.
    Include:
    - Initial interview data (7 questions)
    - Preliminary hypotheses
    - Specific questions and their answers
    - Timestamp and metadata
    - Warnings that this is automated processing

    PART 2 - CLASSIFICATION:
    Send the structured data to the automated classification model to obtain:
    - Primary medical category
    - Confidence level
    - Preliminary recommendations
    - ALWAYS include a warning that this is NOT a medical diagnosis

    The JSON must be valid and optimized for the automated medical classification model.
  expected_output: >
    WARNING: This classification is generated by AI for informational purposes only. It does NOT constitute a medical diagnosis and professional medical evaluation is required.

    Complete JSON with structured data AND classification result:
    {
      "ai_disclaimer": "IMPORTANT: This information is generated by AI and does NOT replace professional medical diagnosis. Consult a certified doctor.",
      "patient_id": "auto-generated",
      "timestamp": "ISO format",
      "consultation_topic": "consultation topic",
      "initial_interview": {
        "chief_complaint": "main reason",
        "symptom_onset": "symptom onset",
        "symptom_intensity": "intensity 1-10",
        "medical_history": "medical history",
        "current_medications": "current medications",
        "family_history": "family history",
        "habits": "relevant habits"
      },
      "specific_analysis": {
        "hypotheses": ["hyp1 (AI - not diagnosis)", "hyp2 (AI - not diagnosis)", "hyp3 (AI - not diagnosis)"],
        "specific_questions": ["q1", "q2", "q3", "q4", "q5"],
        "specific_answers": ["answer1", "answer2", "answer3", "answer4", "answer5"]
      },
      "structured_data": {
        "symptoms": ["symptom list"],
        "duration": "duration",
        "severity": "severity",
        "associated_factors": ["factors"],
        "risk_factors": ["risks"]
      },
      "classification_result": {
        "primary_category": "primary_category (AI - reference only)",
        "confidence_score": 0.85,
        "secondary_categories": ["secondary_category (AI - reference only)"],
        "model_used": "ai_medical_classifier_automated",
        "reasoning": "AI model explanation",
        "recommendations": ["recommendation1 - consult doctor", "recommendation2 - professional evaluation"],
        "medical_disclaimer": "WARNING: Automatic AI classification. This is NOT a medical diagnosis. A professional medical consultation is required."
      },
      "classification_ready": true,
      "process_completed": true,
      "final_disclaimer": "FINAL REMINDER: This information is generated by artificial intelligence and does NOT replace professional medical assessment by a certified doctor."
    }

    REQUIRED FINAL MESSAGE: "Remember that I am DiagnostiCAT, an AI assistant for collecting medical information. All information provided is for reference only and does NOT replace consultation with a medical professional. Please consult a medical specialist for appropriate diagnosis and treatment."
  agent: json_data_structurer
  context:
    - conversational_interview_task
    - specific_questions_analysis_task
